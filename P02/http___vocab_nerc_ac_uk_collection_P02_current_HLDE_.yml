labels:
  - name: "altLabel"
    original: "HalocDynam_WC"
    path: "http://www.w3.org/2004/02/skos/core#altLabel"
    translations:
      - fr: "HalocDynam_WC"
  - name: "definition"
    original: "Parameters relating to the rates of creation and consumption of volatile halocarbons (compounds comprising carbon atoms covalently bonded to fluorine, chlorine, bromine or iodine atoms) other than tracers (i.e. freons/chlorofluorocarbons) and contaminants in any body of fresh or salt water."
    path: "http://www.w3.org/2004/02/skos/core#definition"
    translations:
      - fr: "Paramètres relatifs aux taux de création et de consommation de halocarbures volatils (composés comprenant des atomes de carbone liés de manière covalente au fluor, au chlore, au brome ou aux atomes d'iode) autres que des traceurs (c'est-à-dire des freons / chlorofluorocarbures) et des contaminants dans n'importe quel corps d'eau douce ou salée."
uri: "http://vocab.nerc.ac.uk/collection/P02/current/HLDE/3/"
