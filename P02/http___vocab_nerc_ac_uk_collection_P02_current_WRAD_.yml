labels:
  - name: "altLabel"
    original: "WC_RadAct"
    path: "http://www.w3.org/2004/02/skos/core#altLabel"
    translations:
      - fr: "STHSRTHS"
  - name: "definition"
    original: "All parameters associated with radioactivity in any body of fresh or salt water, including radiation counts, isotope activities and activity ratios. Activities per unit mass of SPM are included."
    path: "http://www.w3.org/2004/02/skos/core#definition"
    translations:
      - fr: "Tous les paramètres associés à la radioactivité dans n'importe quel corps d'eau douce ou salée, y compris le nombre de radiations, les activités isotopiques et les rapports d'activité. Les activités par unité de masse de SPM sont incluses."
uri: "http://vocab.nerc.ac.uk/collection/P02/current/WRAD/2/"
