labels:
  - name: "altLabel"
    original: "FishBiomass"
    path: "http://www.w3.org/2004/02/skos/core#altLabel"
    translations:
      - fr: "Biomasse de poisson"
  - name: "definition"
    original: "Parameters quantifying the mass of fish (Osteichthyes, Agnatha and Chrondrichthyes)in total or by species per unit area or per unit volume in any body of fresh or salt water expressed in any form (e.g. wet weight, dry weight, carbon, nitrogen, etc.)."
    path: "http://www.w3.org/2004/02/skos/core#definition"
    translations:
      - fr: "Paramètres quantifier la masse de poissons (ostéichthyes, Agnatha et Chrondrichthyes) au total ou par espèce par unité de surface ou par unité de volume dans n'importe quel corps d'eau douce ou salée exprimée sous quelque forme que ce soit (par exemple le poids humide, le poids sec, le carbone, l'azote, etc.)."
uri: "http://vocab.nerc.ac.uk/collection/P02/current/FIBM/1/"
