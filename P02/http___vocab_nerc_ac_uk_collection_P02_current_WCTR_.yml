labels:
  - name: "altLabel"
    original: "WC_tracer"
    path: "http://www.w3.org/2004/02/skos/core#altLabel"
    translations:
      - fr: "WC_tracer"
  - name: "definition"
    original: "Parameters describing the amount in a sample of a tracer (rhodamine, SF6, 3He, etc.) that has been purposely released into  a water body to track water mass movements or quantify exchanges with the atmosphere."
    path: "http://www.w3.org/2004/02/skos/core#definition"
    translations:
      - fr: "Paramètres décrivant la quantité dans un échantillon d'un traceur (rhodamine, SF6, 3HE, etc.) qui a été délibérément libéré dans un plan d'eau pour suivre les mouvements de la masse d'eau ou quantifier les échanges avec l'atmosphère."
uri: "http://vocab.nerc.ac.uk/collection/P02/current/WCTR/1/"
